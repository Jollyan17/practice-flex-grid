<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 02 — Product Grid</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="product-grid">
    <article class="product-card">
      <div class="img-placeholder"></div>
      <h2 class="product-name">Wireless Headphones</h2>
      <p class="product-price">$79.99</p>
      <button type="button">Add to cart</button>
    </article>
    <article class="product-card">
      <div class="img-placeholder"></div>
      <h2 class="product-name">Running Shoes</h2>
      <p class="product-price">$129.00</p>
      <button type="button">Add to cart</button>
    </article>
    <article class="product-card">
      <div class="img-placeholder"></div>
      <h2 class="product-name">Ceramic Mug Set</h2>
      <p class="product-price">$24.50</p>
      <button type="button">Add to cart</button>
    </article>
    <article class="product-card">
      <div class="img-placeholder"></div>
      <h2 class="product-name">Backpack — Slate</h2>
      <p class="product-price">$59.00</p>
      <button type="button">Add to cart</button>
    </article>
    <article class="product-card">
      <div class="img-placeholder"></div>
      <h2 class="product-name">Desk Lamp</h2>
      <p class="product-price">$38.90</p>
      <button type="button">Add to cart</button>
    </article>
    <article class="product-card">
      <div class="img-placeholder"></div>
      <h2 class="product-name">Water Bottle 1L</h2>
      <p class="product-price">$14.99</p>
      <button type="button">Add to cart</button>
    </article>
  </main>
</body>
</html>
